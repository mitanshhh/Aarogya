services:
  # ─────────────────────────────────────────────────
  # Main FastAPI Backend
  # ─────────────────────────────────────────────────
  - type: web
    name: aarogya-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: Aarogya Health Engine
      - key: API_V1_STR
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://my-aarogya.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CHAT_NLP_PROVIDER
        value: groq
      - key: AGGREGATOR_URL
        fromService:
          name: aarogya-aggregator
          type: web
          property: host

  # ─────────────────────────────────────────────────
  # Federated Learning Aggregator (FedAvg service)
  # ─────────────────────────────────────────────────
  - type: web
    name: aarogya-aggregator
    runtime: python
    plan: free
    region: oregon
    rootDir: backend/federation-aggregator
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
